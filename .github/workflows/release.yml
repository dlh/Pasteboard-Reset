name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Version must use semantic version format, such as 1.2.3." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Build archive
        run: make archive VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="${{ github.run_number }}"

      - name: Verify app bundle version
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'build/Release/Pasteboard Reset.app/Contents/Info.plist')" = "${{ steps.version.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' 'build/Release/Pasteboard Reset.app/Contents/Info.plist')" = "${{ github.run_number }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="build/Release/Pasteboard Reset-${{ steps.version.outputs.version }}.zip"

          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" "${archive}" --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" "${archive}" \
              --title "Pasteboard Reset ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pasteboard Reset ${{ steps.version.outputs.version }}
          path: build/Release/Pasteboard Reset-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
