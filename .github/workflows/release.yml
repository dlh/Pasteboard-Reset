name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest
    env:
      APP_NAME: Pasteboard Reset
      NOTARY_PROFILE: PasteboardResetNotary

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Version must use semantic version format, such as 1.2.3." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/developer-id.p12"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

          printf '%s' "${APPLE_CERTIFICATE_P12_BASE64}" | base64 -D > "${certificate_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${keychain_path}"

          security find-identity -v -p codesigning "${keychain_path}"

      - name: Configure notarization
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "${NOTARY_PROFILE}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}"

      - name: Build, sign, notarize, and staple archive
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          make staple \
            VERSION="${{ steps.version.outputs.version }}" \
            BUILD_NUMBER="${{ github.run_number }}" \
            SIGN_IDENTITY="${SIGN_IDENTITY}" \
            NOTARY_PROFILE="${NOTARY_PROFILE}"

      - name: Verify app bundle version
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/${APP_NAME}.app/Contents/Info.plist")" = "${{ steps.version.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "build/${APP_NAME}.app/Contents/Info.plist")" = "${{ github.run_number }}"

      - name: Verify signature and notarization
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          codesign --verify --deep --strict --verbose=4 "build/${APP_NAME}.app"
          codesign -dv --verbose=4 "build/${APP_NAME}.app" 2>&1 | grep -F "Authority=${SIGN_IDENTITY}"
          xcrun stapler validate "build/${APP_NAME}.app"
          spctl --assess --type execute --verbose=4 "build/${APP_NAME}.app"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="build/${APP_NAME}-${{ steps.version.outputs.version }}.zip"

          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" "${archive}" --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" "${archive}" \
              --title "Pasteboard Reset ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pasteboard Reset ${{ steps.version.outputs.version }}
          path: build/Pasteboard Reset-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
